[project]
name = "stable-sponsers"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "openpyxl>=3.1.5",
    "ortools>=9.15.6755",
    "pandas>=3.0.5",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.0",
]

[build-system]
requires = ["uv_build>=0.9.29,<0.10"]
build-backend = "uv_build"

# The distribution name keeps the "sponsers" spelling; the import name doesn't.
[tool.uv.build-backend]
module-name = "stable_sponsors"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]

rules:
  - id: 0
    name: incumbency_preassignment
    class: hard
    description: Repeaters under the year limit are placed in their prior course before open selection.
    params: {}
    source: "Procedure §2.1; diff 0"
    status: documented
    notes: "Assumes that every listed repeater is eligible to teach the course they taught last year. If not, the rule will fail."

  - id: 1
    name: rank_preference
    class: priority
    description: Prefer placing teachers in higher-ranked choices.
    params:
      weights: [7, 6, 5, 4, 3, 2, 1]
    source: "Procedure §2.2; diff 1"
    status: documented

  - id: 2
    name: past_experience
    class: priority
    description: Teachers with more experience are preferred for certain courses.
    params:
      requirements_file: "course_params.csv"
    source: "Procedure §3.2; diff 3"
    status: deferred
    notes: "Since no teacher experience data is available, this rule is deferred. If experience data is added, this rule will be implemented."

  - id: 3
    name: qualification_required
    class: hard
    description: Courses with a requirement (e.g. scuba) only take qualified teachers.
    params: {}
    source: "Procedure §3.3; diff 5"
    status: documented
    notes: "Assumes that the qualifications listed in CourseParams are accurate and complete. If a teacher is missing a qualification, the rule will fail."

  - id: 4
    name: only_ranked_courses
    class: hard
    description: A teacher who submitted is placed only in a course they ranked in that round.
    params: {}
    source: "diff 13"
